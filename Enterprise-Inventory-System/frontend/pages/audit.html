<div class="mb-4 d-flex align-items-center justify-content-between">
    <div>
        <h4 class="mb-1"><i class="bi bi-shield-check me-2 text-primary"></i>Audit Trail & Activity Logs</h4>
        <p class="text-muted mb-0">Track user actions and system changes for security and compliance</p>
    </div>
    <button class="btn btn-primary" onclick="loadAuditLogs()">
        <i class="bi bi-arrow-clockwise me-1"></i> Refresh Logs
    </button>
</div>

<div class="card border-0 shadow-sm">
    <div class="card-body">
        <div class="table-responsive">
            <table id="auditTable" class="table table-hover align-middle" style="width:100%">
                <thead class="table-light">
                    <tr>
                        <th>Log ID</th>
                        <th>Date & Time</th>
                        <th>User</th>
                        <th>Action</th>
                        <th>Details</th>
                        <th>IP Address</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>
