<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Demand Forecast</title>
    <link rel="stylesheet" href="../assets/css/dashboard.css?v=4">
</head>
<body>
    <h1>Demand Forecast</h1>
    <div>
        <label for="productId">Product ID:</label>
        <input type="number" id="productId" min="1" value="1" />
        <label for="periods">Days to forecast:</label>
        <input type="number" id="periods" min="1" value="30" />
        <button id="loadForecastBtn">Load Forecast</button>
    </div>
    <table id="forecastTable" border="1" style="margin-top:20px; border-collapse:collapse; width:100%;">
        <thead><tr><th>Date</th><th>Forecast Qty</th></tr></thead>
        <tbody></tbody>
    </table>
    <script src="../assets/js/common.js?v=4"></script>
    <script src="../assets/js/forecast.js?v=4"></script>
</body>
</html>
