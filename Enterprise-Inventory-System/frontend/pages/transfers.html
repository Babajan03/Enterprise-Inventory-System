<div class="mb-4 d-flex align-items-center justify-content-between">
    <div>
        <h4 class="mb-1">Stock Transfers</h4>
        <p class="text-muted mb-0">Manage inventory movements between warehouses</p>
    </div>
    <button class="btn btn-primary" onclick="openCreateTransferModal()">
        <i class="bi bi-plus-lg me-1"></i> New Transfer
    </button>
</div>

<div class="card border-0 shadow-sm">
    <div class="card-body">
        <div class="table-responsive">
            <table id="transfersTable" class="table table-hover align-middle" style="width:100%">
                <thead class="table-light">
                    <tr>
                        <th>Transfer #</th>
                        <th>Date</th>
                        <th>Product</th>
                        <th>From Warehouse</th>
                        <th>To Warehouse</th>
                        <th>Qty</th>
                        <th>Status</th>
                        <th>Requested By</th>
                        <th class="text-end">Actions</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>

<!-- Create Transfer Modal -->
<div class="modal fade" id="transferModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Request Stock Transfer</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label>Product</label>
                    <select id="transferProduct" class="form-select"></select>
                </div>
                <div class="mb-3">
                    <label>From Warehouse</label>
                    <select id="transferFrom" class="form-select"></select>
                </div>
                <div class="mb-3">
                    <label>To Warehouse</label>
                    <select id="transferTo" class="form-select"></select>
                </div>
                <div class="mb-3">
                    <label>Quantity</label>
                    <input type="number" id="transferQty" class="form-control" min="1" />
                </div>
                <div class="mb-3">
                    <label>Notes (Optional)</label>
                    <textarea id="transferNotes" class="form-control" rows="2"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button class="btn btn-primary" onclick="saveTransfer()">Submit Request</button>
            </div>
        </div>
    </div>
</div>
