<div class="d-flex justify-content-between align-items-center mb-4">
    <h4><i class="bi bi-boxes text-primary me-2"></i>Inventory Management</h4>
    <div>
        <button class="btn btn-success me-2" onclick="window.openReceiveModal()">
            <i class="bi bi-box-arrow-in-down me-1"></i> Receive Goods (GRN)
        </button>
    </div>
</div>

<div class="card">
    <div class="card-body table-responsive">
        <table id="inventoryTable" class="table table-striped align-middle" style="width:100%">
            <thead>
                <tr>
                    <th>Product Code</th>
                    <th>Product Name</th>
                    <th>Warehouse</th>
                    <th>Quantity</th>
                    <th>Reorder Level</th>
                    <th>Last Updated</th>
                    <th class="text-center">Action</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<!-- Adjust Inventory Modal -->
<div class="modal fade" id="adjustModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="bi bi-pencil-square text-warning me-2"></i>Adjust Inventory</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="adjustInventoryID" />
                <div class="mb-3">
                    <label class="form-label fw-semibold">Product</label>
                    <input type="text" id="adjustProductName" class="form-control bg-light" disabled />
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">New Quantity</label>
                    <input type="number" id="adjustQuantity" class="form-control" placeholder="Enter new absolute quantity" />
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Remarks</label>
                    <input type="text" id="adjustRemarks" class="form-control" placeholder="Reason for adjustment" />
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button class="btn btn-primary" onclick="window.saveAdjustment()">Save Adjustment</button>
            </div>
        </div>
    </div>
</div>

<!-- Goods Receiving (GRN) Modal -->
<div class="modal fade" id="receiveModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="bi bi-box-arrow-in-down text-success me-2"></i>Receive Goods (GRN)</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Target Inventory Item</label>
                    <select id="receiveInventoryItem" class="form-select"></select>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Quantity Received</label>
                    <input type="number" id="receiveQuantity" class="form-control" placeholder="Enter quantity received" min="1" />
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">GRN / Reference Number</label>
                    <input type="text" id="receiveRef" class="form-control" placeholder="e.g. GRN-20260812-01" />
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button class="btn btn-success" onclick="window.saveReceiveGoods()">Confirm Receipt</button>
            </div>
        </div>
    </div>
</div>
